name = 'rarebooks-marketing-site'
account_id = "aa2e3d3c8224d09194e8635aca7eff6f"
compatibility_date = "2026-06-13"
compatibility_flags = [ "nodejs_compat" ]

[build]
command = "npm run build"

[[d1_databases]]
binding = "DB"
database_name = "rarebooks"
database_id = "fa09e96d-eb57-4425-95b3-34edc6a32d6e"

[[kv_namespaces]]
binding = "SESSION"
id = "c1344d3efc2a437dbd016ecc56bfb550"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1


