name = 'rarebooks-marketing-site'
account_id = "aa2e3d3c8224d09194e8635aca7eff6f"
compatibility_date = "2026-06-13"
compatibility_flags = [ "nodejs_compat" ]

[[d1_databases]]
binding = "DB"
database_name = "rarebooks"
database_id = "fa09e96d-eb57-4425-95b3-34edc6a32d6e"

[[kv_namespaces]]
binding = "SESSION"
id = "c1344d3efc2a437dbd016ecc56bfb550"

# Spec 0014: the sign up IP and check counters and the 30 second check cache
# (namespace "rarebooks-marketing-site-onboarding").
[[kv_namespaces]]
binding = "ONBOARDING_KV"
id = "02036753f5744df1b554f612ef075b2a"

# Spec 0014. Secrets set with `wrangler secret put`: CONTROL_SIGNING_SECRET (the control site's
# marketing_secret) and TURNSTILE_SECRET_KEY.
[vars]
PUBLIC_SITE_URL = "https://rarebooks.cc"
CONTROL_SITE_URL = ""
PUBLIC_TURNSTILE_SITE_KEY = ""

[assets]
directory = "./dist/client"
binding = "ASSETS"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1